[package]
name = "remote-slint"
version = "0.1.0"
edition = "2024"

[dependencies]
slint        = "1.17.0"
serde        = { version = "1.0.228", features = ["derive"] }
toml         = "1.1.2"
anyhow       = "1.0.103"

[build-dependencies]
slint-build  = "1.17.0"

[profile.release]
opt-level     = 'z'
lto           = "fat"
codegen-units = 1
panic         = 'abort'
strip         = "symbols"
incremental   = false

[dev-dependencies]
tokio        = { version = "1.0", features = ["full"] }
